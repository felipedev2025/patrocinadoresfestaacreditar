# Produção em VPS única: web + worker + PostgreSQL + Redis + MinIO (S3).
# Uso: cp .env.example .env (ajuste segredos) && docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patro}
      POSTGRES_DB: patrocinios
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U patro"], interval: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9001:9001"] # console apenas local / via túnel SSH

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set s3 http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin}; do sleep 2; done;
             mc mb -p s3/$${S3_BUCKET:-patrocinios} && mc version enable s3/$${S3_BUCKET:-patrocinios}"
    env_file: .env

  migrate:
    build: .
    env_file: .env
    environment: &dbenv
      DATABASE_URL: postgresql://patro:${POSTGRES_PASSWORD:-patro}@postgres:5432/patrocinios?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      NODE_ENV: production
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: *dbenv
    ports: ["127.0.0.1:3000:3000"] # publique via proxy reverso com HTTPS (Caddy/Nginx)
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: *dbenv
    command: ["npx", "tsx", "worker/index.ts"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "3", memory: 4g } # evita que a renderização derrube o servidor web
    shm_size: 1gb # Chrome precisa de /dev/shm maior

volumes:
  pgdata:
  redisdata:
  miniodata:
